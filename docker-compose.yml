services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "5000:5000"

    env_file:
      - backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: finance-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

    container_name: finance-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: